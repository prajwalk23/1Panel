# fork: keeps the fork in step with upstream 1Panel without ever overwriting fork code.
# main merges the newest upstream *stable* tag; a clean merge is pushed, a conflict opens a PR.
# The fork's .github/workflows are always kept as they are on main.
# Never force-pushes, resets or rebases. See fork/README.md.
name: Sync upstream

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != '1Panel-dev/1Panel'
    runs-on: ubuntu-latest
    env:
      UPSTREAM_URL: https://github.com/1Panel-dev/1Panel.git
      MAIN_BRANCH: main
    steps:
      - name: Check token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "${SYNC_TOKEN}" ]; then
            echo "::error::Repository secret SYNC_TOKEN is missing. Create a fine-grained token for this repo with Contents, Workflows and Pull requests (read and write) and save it as SYNC_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAIN_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Fetch upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "${UPSTREAM_URL}"
          # Upstream tags go to their own namespace so they never mix with fork tags (v2.5.1.1 ...).
          git fetch --no-tags upstream "+refs/tags/*:refs/upstream-tags/*"

      - name: Merge newest upstream stable tag
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$(git for-each-ref --format='%(refname:strip=2)' refs/upstream-tags/ \
                  | grep -E '^v2\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -z "${TAG}" ]; then
            echo "No upstream stable tag found."
            exit 0
          fi
          TAG_SHA="$(git rev-parse "refs/upstream-tags/${TAG}^{commit}")"
          echo "Newest upstream stable tag: ${TAG} (${TAG_SHA})"
          if git merge-base --is-ancestor "${TAG_SHA}" HEAD; then
            echo "${MAIN_BRANCH} already contains ${TAG}. Nothing to do."
            exit 0
          fi

          BRANCH="sync/upstream-${TAG}"
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            echo "${BRANCH} already exists and waits for review. Nothing to do."
            exit 0
          fi

          keep_fork_workflows() {
            # Workflow files stay exactly as on main (also removes ones upstream adds or changes).
            git rm -r -f -q --ignore-unmatch -- .github/workflows
            git checkout HEAD -- .github/workflows
          }

          merged=0
          if git merge --no-ff --no-commit "${TAG_SHA}"; then
            merged=1
          else
            # A conflict only inside .github/workflows (for example upstream edits a workflow
            # the fork deleted) is not a real conflict: the fork's version wins.
            others="$(git diff --name-only --diff-filter=U | grep -v '^\.github/workflows/' || true)"
            if [ -z "${others}" ] && [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              merged=1
            fi
          fi

          if [ "${merged}" = "1" ]; then
            keep_fork_workflows
            git commit -m "chore(sync): merge upstream ${TAG}"
            git push origin "HEAD:refs/heads/${MAIN_BRANCH}"
            echo "::notice::Merged upstream ${TAG} into ${MAIN_BRANCH}."
          else
            git merge --abort
            git push origin "${TAG_SHA}:refs/heads/${BRANCH}"
            gh pr create \
              --base "${MAIN_BRANCH}" \
              --head "${BRANCH}" \
              --title "Sync upstream ${TAG}" \
              --body "Upstream \`${TAG}\` does not merge cleanly into \`${MAIN_BRANCH}\`.

          Resolve locally:

          \`\`\`
          git fetch origin
          git switch ${MAIN_BRANCH}
          git merge origin/${BRANCH}
          \`\`\`

          Fix the conflicts using \`FORK_PATCHES.md\`, keep the fork's \`.github/workflows\`, then push \`${MAIN_BRANCH}\` and close this PR."
            echo "::warning::Conflict merging upstream ${TAG}. Opened a PR from ${BRANCH}."
          fi
