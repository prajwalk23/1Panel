# fork: tests pull requests into main (for example upstream sync PRs) and manual runs. It does not build:
# release.yml builds the frontend and the binaries when a tag is pushed, and runs the same tests.
name: Fork CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository != '1Panel-dev/1Panel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: |
            agent/go.sum
            core/go.sum

      - name: Unit tests (fork packages)
        run: |
          (cd agent && go test ./utils/github/... && go test ./app/service/ -run "MemSustained|ForkClean|SameVersion|ForkErrorPage|ForkDefaultHtml|ForkStaleStock")
          (cd core && go test ./init/migration/migrations/ -run TestStripVMAndAIMenus)
          (cd core && go test ./utils/github/... && go test ./init/migration/migrations/ -run TestAddGithubMenu)

      - name: Stub embedded frontend files
        # core embeds the built frontend; vet only needs the files to exist, so the frontend is not built here.
        run: |
          mkdir -p core/cmd/server/web/assets
          touch core/cmd/server/web/assets/.keep core/cmd/server/web/index.html

      - name: Vet fork code
        run: |
          (cd agent && go vet ./utils/github/... ./app/api/v2/... ./router/... ./init/migration/... ./i18n/...)
          (cd core && go vet ./utils/github/... ./app/... ./router/... ./global/... ./init/migration/... ./i18n/...)
