<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{CODE}} {{TITLE}}</title>
    <style>
        html,body,div,h1,p,*{margin:0;padding:0;}
        body{
            background-color:#fefefe;
            color:#333;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        }
        .box{
            width:580px;
            max-width:90%;
            margin:0 auto;
            padding-top:18vh;
            text-align:center;
        }
        .code{
            font-size:96px;
            font-weight:bold;
            color:#1b95dc;
            line-height:1;
        }
        h1{
            font-size:22px;
            font-weight:normal;
            margin-top:16px;
        }
        p{
            font-size:15px;
            color:#666;
            margin-top:12px;
        }
    </style>
</head>

<body>
<div class="box">
    <div class="code">{{CODE}}</div>
    <h1>{{TITLE}}</h1>
    <p>{{MESSAGE}}</p>
</div>
</body>
</html>
